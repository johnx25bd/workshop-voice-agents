[project]
name = "workshop-voice-agents"
version = "0.1.0"
description = "Build voice agents with LiveKit — workshop materials"
requires-python = ">=3.9"
dependencies = [
    "livekit-agents[silero,turn-detector]~=1.3",
    "livekit-plugins-noise-cancellation~=0.2",
    "python-dotenv",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
